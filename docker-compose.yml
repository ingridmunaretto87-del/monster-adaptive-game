version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: monster-game-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: monster-game-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monster-game-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://root:rootpassword@mongodb:27017/monster-adaptive-game?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend-web:
    image: node:18-alpine
    container_name: monster-game-frontend-web
    ports:
      - "5173:5173"
    working_dir: /app
    command: npm run dev
    environment:
      VITE_API_URL: http://localhost:5000
    volumes:
      - ./frontend-web:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongodb_data:
  redis_data:
